services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: result_app
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: result_web
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    profiles: ["frontend"]
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    volumes:
      - ./src:/var/www/html
    ports:
      - "5173:5173"
    command: npm run dev -- --host  

  db:
    image: mysql:8.4
    container_name: result_db
    environment:
      MYSQL_DATABASE: result_db
      MYSQL_USER: result_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: